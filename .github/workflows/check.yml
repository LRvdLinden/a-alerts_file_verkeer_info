name: Controle (service en status)
on:
  workflow_dispatch:
    inputs:
      keer: { description: "Aantal keer", default: "6" }
      pauze: { description: "Seconden ertussen", default: "45" }
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          for i in $(seq 1 ${{ inputs.keer }}); do
            curl -s -m 30 -o /tmp/h -w "P $(date -u +%H:%M:%S) health %{http_code} %{time_total}s " https://desperate-daisy-p2000-397a756d.apps.mistral.run/health; head -c 600 /tmp/h; echo
            sleep ${{ inputs.pauze }}
          done
          curl -s -m 20 https://p2000-apeldoorn-api.lrvdlinden.workers.dev/v1/status | python3 -c "
          import json,sys;d=json.load(sys.stdin)
          for g in d['groepen']:
            for o in g['onderdelen']:
              if o['id'] in ('heli','verkeer'): print('P ST',o['id'],o['staat'],o.get('detail'))" || true
