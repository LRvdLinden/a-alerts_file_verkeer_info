name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s -m 30 https://desperate-daisy-p2000-397a756d.apps.mistral.run/health | sed "s/^/P health /"; echo
          curl -s -m 20 https://p2000-apeldoorn-api.lrvdlinden.workers.dev/v1/verkeer | python3 -c "
          import json,sys;d=json.load(sys.stdin)
          print('P worker verouderd',d['verouderd'],'items',len(d['items']))
          for v in d['items']:
            if v['soort']=='file': print('P file',v.get('kop'),v.get('traject'),v.get('lengte_km'),v.get('vertraging_min'),v.get('bron'))"
          curl -s -m 20 "https://a-alerts.nl/assets/js/widget.js" | grep -o "Er is nu geen KNMI-weerwaarschuwing[^<]*" | sed "s/^/P tekst /"
          curl -sI -m 20 "https://a-alerts.nl/widget/?w=weer" | grep -i -E "^HTTP|x-frame|content-security" | sed "s/^/P hdr /"
          curl -s -m 20 "https://a-alerts.nl/widget/weer.js" | head -c 80 | sed "s/^/P weerjs /"; echo
