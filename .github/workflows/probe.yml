name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          for i in 1 2 3 4; do curl -s -m 40 -o /tmp/h -w "P health %{http_code} %{time_total}s " https://desperate-daisy-p2000-397a756d.apps.mistral.run/health; head -c 420 /tmp/h; echo; sleep 20; done
          curl -s -m 20 https://p2000-apeldoorn-api.lrvdlinden.workers.dev/v1/status | python3 -c "
          import json,sys;d=json.load(sys.stdin)
          for g in d['groepen']:
            for o in g['onderdelen']:
              if o['id'] in ('heli','verkeer'): print('P ST',o['id'],o['staat'],o.get('detail'))"
