name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sI https://a-alerts.nl/widget/ | grep -i -E "^HTTP|x-frame|content-security"
          curl -sI https://a-alerts.nl/nieuws/ | grep -i -E "^HTTP|x-frame"
          curl -s https://a-alerts.nl/widget/ | grep -o "kaart,verkeer[^\"]*" | head -1
