name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sv -m 30 -o /tmp/h https://desperate-daisy-p2000-397a756d.apps.mistral.run/health 2>&1 | grep -E "^\*|^< |^> GET" | grep -v -i "cert\|CAfile\|ALPN\|TLS\|subject\|issuer\|expire\|start date" ; head -c 300 /tmp/h; echo
