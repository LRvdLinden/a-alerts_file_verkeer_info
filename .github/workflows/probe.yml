name: probe
on: workflow_dispatch
permissions: { contents: write }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir s && cd s
          curl -s -m 120 -o trafficspeed.xml.gz https://opendata.ndw.nu/trafficspeed.xml.gz
          curl -s -m 300 -o measurement_current.xml.gz https://opendata.ndw.nu/measurement_current.xml.gz
          ls -la
          # region only (rough bbox on site table is done locally); keep the files if small enough for git
          for f in *.gz; do s=$(stat -c%s $f); [ $s -gt 95000000 ] && { echo "te groot $f $s"; zcat $f | head -c 3000 > ${f%.gz}.head.txt; rm $f; }; done
          git init -q && git checkout -q -b ndw-files && git add . && git -c user.name=a -c user.email=a@a commit -qm samples
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ndw-files
